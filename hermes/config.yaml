# Realtor Agent — Hermes Configuration
# Generated by provision-realtor.sh
# Replace {{PLACEHOLDER}} values before deployment

model:
  default: deepseek/deepseek-v4-pro
  provider: deepseek
  base_url: https://api.deepseek.com

providers: {}
fallback_providers: []

toolsets:
  - hermes-telegram

# Strip tools that don't apply to a realtor agent
# Keeps context windows lean. Remove from this list to re-enable.
disabled_toolsets:
  - image_gen        # No image generation needed
  - spotify          # No music control needed
  - homeassistant    # No smart home control
  - discord          # No Discord
  - discord_admin    # No Discord admin
  - yuanbao          # No Yuanbao
  - feishu_doc       # No Feishu/Lark
  - feishu_drive     # No Feishu/Lark
  - tts              # No text-to-speech
  - rl               # No RL training
  - moa              # No Mixture of Agents

agent:
  max_turns: 60
  gateway_timeout: 1800
  personalities:
    realtor: |
      You are a professional real estate AI assistant for {{REALTOR_NAME}}, a licensed real estate agent. You are knowledgeable about real estate markets, MLS data, comps, tax records, and property valuation. Your tone is professional, helpful, and efficient — like an experienced transaction coordinator who knows the market cold.

      When providing listing data, always include: address, price, beds/baths, square footage, lot size, DOM, and any notable features. When pulling comps, include $/sqft calculations and date of sale.

      Never make up property data. Always cite your source (MLS, county records, etc.). If you can't find something, say so plainly and suggest alternatives.

      Remember: {{REALTOR_NAME}} is in the field, often driving. Keep responses scannable on mobile. Use bullets, not walls of text.

terminal:
  backend: local
  timeout: 180
  cwd: /opt/realtor-agent
  persistent_shell: true

browser:
  inactivity_timeout: 120

file_read_max_chars: 100000

memory:
  memory_enabled: true
  user_profile_enabled: true

delegation:
  max_concurrent_children: 3

timezone: "America/Chicago"

telegram:
  reactions: true
  bot_token: "{{BOT_TOKEN}}"

cron:
  wrap_response: true

logging:
  level: INFO

skills:
  external_dirs:
    - /opt/realtor-agent/skills

# ── Web Search / Extract ──────────────────────────────────────
# web_search and web_extract require one of these API keys:
#   EXA_API_KEY | PARALLEL_API_KEY | FIRECRAWL_API_KEY | TAVILY_API_KEY
# Without one, agents fall back to DDG search (search only, no extract).
#
# Firecrawl free tier: 500 credits/month — sufficient for a single realtor.
# Sign up at https://firecrawl.dev, get key, paste below.
# Set in .env: FIRECRAWL_API_KEY=fc-xxxxxxxxxxxx

_context: |
  The agent's context files live in /opt/realtor-agent/context/.
  Load these files to understand {{REALTOR_NAME}}'s market, specialties, and active clients.
  - context/realtor-profile.md — bio, brokerage, MLS, voice/tone
  - context/market-context.md — farm areas, price ranges, property types
  - context/client-roster.md — active buyers/sellers and their criteria
